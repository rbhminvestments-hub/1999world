<!DOCTYPE html>
<html>

<head>

<title>1999world OS</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body {
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    font-family:"Courier New", monospace;
    background:#003366;
}


/* Desktop */

.desktop {

    height:100vh;
    background:
    linear-gradient(
        135deg,
        #003366,
        #006666
    );

    color:white;
    position:relative;

}


/* CRT effect */

.desktop:after {

    content:"";
    position:absolute;
    inset:0;

    background:
    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 1px,
        transparent 3px
    );

    pointer-events:none;

}



/* Header */

.logo {

    padding:20px;
    font-size:28px;
    color:#00ff99;

}

.subtitle {

    font-size:14px;
    color:white;

}



/* Icons */

.icons {

    display:flex;
    flex-wrap:wrap;
    padding:20px;
    gap:25px;

}


.icon {

    width:90px;
    text-align:center;
    cursor:pointer;
    color:white;

}


.icon-box {

    width:55px;
    height:55px;
    margin:auto;

    background:#009999;

    border:3px outset #66ffff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;

}


.icon:hover .icon-box {

    background:#00cccc;

}


.icon-name {

    margin-top:8px;
    font-size:13px;

}



/* Bottom bar */

.taskbar {

    position:absolute;

    bottom:0;
    left:0;
    right:0;

    height:42px;

    background:#002244;

    border-top:3px solid #00aa88;

    display:flex;

    align-items:center;

    padding:0 10px;

    gap:10px;

}


.begin {

    background:#009999;

    border:3px outset #66ffff;

    padding:5px 18px;

    color:white;

    cursor:pointer;

}


.status {

    margin-left:auto;

    font-size:12px;

    color:#00ff99;

}



/* Welcome window */

.window {

    position:absolute;

    right:40px;

    top:90px;

    width:260px;

    background:#c0d8d8;

    color:#003333;

    border:3px solid #003333;

}


.window-title {

    background:#003366;

    color:white;

    padding:6px;

}


.window-content {

    padding:15px;

    font-size:13px;

}


</style>


</head>


<body>


<div class="desktop">



<div class="logo">

1999world OS

<div class="subtitle">
The community is still online.
</div>

</div>




<div class="icons">



<div class="icon">

<div class="icon-box">
🌎
</div>

<div class="icon-name">
My World
</div>

</div>




<div class="icon">

<div class="icon-box">
✉️
</div>

<div class="icon-name">
Letters
</div>

</div>





<div class="icon">

<div class="icon-box">
🌱
</div>

<div class="icon-name">
Go Outside
</div>

</div>





<div class="icon">

<div class="icon-box">
⚙️
</div>

<div class="icon-name">
Life Settings
</div>

</div>





<div class="icon">

<div class="icon-box">
🗑
</div>

<div class="icon-name">
Things We Don't Need
</div>

</div>



</div>





<div class="window">


<div class="window-title">

Welcome to 1999world

</div>


<div class="window-content">

Bringing back the curiosity,
creativity and connection
of the 90s.

<br><br>

Double-click to explore.

</div>


</div>





<div class="taskbar">


<div class="begin">

Begin

</div>


<div class="status">

Connected: 56K |
Sunday Mode

</div>


</div>



</div>


</body>

</html>
