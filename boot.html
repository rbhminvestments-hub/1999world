<!DOCTYPE html>
<html>
<head>
<title>1999WORLD.EXE</title>

<style>
body {
    background:black;
    color:#00ff00;
    font-family:"Courier New", monospace;
    font-size:20px;
    padding:40px;
}

#screen {
    white-space:pre-line;
}

.cursor {
    animation: blink 1s infinite;
}

@keyframes blink {
    50% {opacity:0;}
}
</style>

</head>

<body>

<div id="screen"></div><span class="cursor">_</span>

<script>

let text = `
C:\\1999WORLD>

Initializing system...

Checking memory........ OK

Loading graphics....... OK

Connecting modem....... OK

Restoring community.... OK


C:\\1999WORLD> RUN 1999WORLD.EXE


Launching 1999WORLD.EXE...
`;

let i = 0;

function typeText(){
    if(i < text.length){
        document.getElementById("screen").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeText,35);
    }
    else {
        setTimeout(function(){
            window.location.href="index.html";
        },2000);
    }
}

typeText();

</script>

</body>
</html>
