<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1999world.net</title>
  <meta name="theme-color" content="#000000">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: start;
      padding: clamp(28px, 6vw, 82px);
      box-sizing: border-box;
      color: #00ff66;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(15px, 2.1vw, 22px);
      line-height: 1.7;
      text-shadow:
        0 0 4px rgba(0, 255, 102, .82),
        0 0 12px rgba(0, 255, 102, .28);
      animation: crt-flicker 3.2s steps(1, end) infinite;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 3px,
          rgba(0, 255, 102, .045) 4px
        );
      z-index: 2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 56%, rgba(0,0,0,.28) 100%);
      z-index: 3;
    }

    #boot {
      position: relative;
      z-index: 1;
      white-space: pre-line;
    }

    .cursor {
      display: inline-block;
      width: .72em;
      height: 1.08em;
      margin-left: 5px;
      vertical-align: -2px;
      background: #00ff66;
      box-shadow: 0 0 7px rgba(0, 255, 102, .8);
      animation: blink 650ms steps(1) infinite;
    }

    .fade-out {
      animation: fade-out 700ms ease forwards;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes crt-flicker {
      0%, 94%, 100% { opacity: 1; }
      95% { opacity: .97; }
      96% { opacity: 1; }
      97% { opacity: .985; }
    }

    @keyframes fade-out {
      to { opacity: 0; visibility: hidden; }
    }

    @media (prefers-reduced-motion: reduce) {
      body, .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <main id="boot" aria-live="polite">
    <span id="boot-text">Starting 1999world...</span><span class="cursor" aria-hidden="true"></span>
  </main>

  <script>
    const bootText = document.getElementById("boot-text");
    const lines = [
      "",
      "Loading analogue life...",
      "Loading human interaction...",
      "Loading memories...",
      "",
      "Connection established.",
      "",
      "Welcome."
    ];

    let index = 0;

    function addNextLine() {
      if (index >= lines.length) {
        window.setTimeout(() => {
          document.body.classList.add("fade-out");
          window.setTimeout(() => {
            window.location.replace("world.html");
          }, 700);
        }, 900);
        return;
      }

      bootText.textContent += `\n${lines[index]}`;
      const current = lines[index];
      index += 1;

      let delay = current ? 430 : 220;
      if (current === "Connection established.") delay = 700;
      if (current === "Welcome.") delay = 900;

      window.setTimeout(addNextLine, delay);
    }

    window.setTimeout(addNextLine, 450);
  </script>
</body>
</html>
