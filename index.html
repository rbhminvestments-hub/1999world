<!DOCTYPE html>
<html>

<head>

<title>1999WORLD.EXE</title>

<style>

body {
    background: black;
    color: #00ff00;
    font-family: "Courier New", monospace;
    font-size: 18px;
    padding: 40px;
}

#screen {
    white-space: pre-line;
}

.cursor {
    animation: blink 0.8s infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}

</style>

</head>


<body>

<div id="screen"></div><span class="cursor">_</span>


<script>

let text = `
1999WORLD SYSTEM


Initializing...


Loading 1999WORLD modules...


[OK] Music & Culture
[OK] Games & Entertainment
[OK] Creative Studio
[OK] Community Network
[OK] Analogue Experiences


Restoring connections......... OK


C:\\1999WORLD>

RUN 1999WORLD.EXE


Launching...


WELCOME TO 1999WORLD.NET
`;


let i = 0;


function typeText(){

    if(i < text.length){

        document.getElementById("screen").innerHTML += text.charAt(i);

        i++;

        setTimeout(typeText, 35);

    } else {

        setTimeout(function(){

            window.location.href="world.html";

        }, 1800);

    }

}


typeText();


</script>


</body>

</html>
